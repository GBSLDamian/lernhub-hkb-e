<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kompressor-Kennlinie: Diagramm mit Eingangspegel auf der X-Achse und Ausgangspegel auf der Y-Achse. Unterhalb des Schwellenwerts verläuft die Linie 1:1, oberhalb flacher im Verhältnis der Ratio.">
  <style>
    .ax { stroke: var(--color-text-muted, #888); stroke-width: 1.5; }
    .lbl { font-family: system-ui, sans-serif; font-size: 12px; fill: var(--color-text, #1a1a1a); }
    .sub { font-family: system-ui, sans-serif; font-size: 11px; fill: var(--color-text-muted, #666); }
    .curve { fill: none; stroke: var(--color-primary, #2a6ebb); stroke-width: 3; }
    .ref { stroke: var(--color-border, #ccc); stroke-width: 1; stroke-dasharray: 4 4; }
    .th { stroke: var(--color-danger, #b3261e); stroke-width: 1.5; stroke-dasharray: 3 3; }
  </style>

  <!-- Achsen -->
  <line x1="50" y1="270" x2="50" y2="20" class="ax"/>
  <line x1="50" y1="270" x2="390" y2="270" class="ax"/>
  <text x="50" y="14" class="lbl">Ausgang (dB)</text>
  <text x="392" y="284" class="lbl">Eingang (dB)</text>

  <!-- 1:1 Referenzlinie (unkomprimiert) -->
  <line x1="50" y1="270" x2="390" y2="20" class="ref"/>
  <text x="300" y="70" class="sub">1:1 (unbearbeitet)</text>

  <!-- Threshold-Markierung -->
  <line x1="220" y1="270" x2="220" y2="20" class="th"/>
  <text x="225" y="30" class="sub" fill="var(--color-danger, #b3261e)">Threshold</text>

  <!-- Kompressor-Kennlinie: 1:1 bis Threshold, dann Ratio 4:1 -->
  <path class="curve" d="M50,270 L220,132 L390,89"/>

  <!-- Knee-Markierung -->
  <circle cx="220" cy="132" r="5" fill="var(--color-primary, #2a6ebb)"/>
  <text x="230" y="140" class="sub">Knie</text>

  <text x="300" y="105" class="sub">Ratio 4:1</text>

  <!-- Makeup Gain Pfeil -->
  <line x1="390" y1="89" x2="390" y2="55" stroke="var(--color-success, #1b7a43)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="50" class="sub" fill="var(--color-success, #1b7a43)">+ Makeup Gain</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-success, #1b7a43)"/>
    </marker>
  </defs>
</svg>
