<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Drei-Punkte-Beleuchtung: Hauptlicht vorne seitlich, Aufhelllicht auf der Gegenseite, Spitzlicht von hinten oben, Kamera vorne, Objekt in der Mitte">
  <defs>
    <radialGradient id="beam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5a94e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5a94e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beamFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f9bff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7f9bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beamHair" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c39bf2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c39bf2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- light cones -->
  <circle cx="150" cy="140" r="130" fill="url(#beam)"/>
  <circle cx="470" cy="150" r="120" fill="url(#beamFill)"/>
  <circle cx="300" cy="60" r="110" fill="url(#beamHair)"/>

  <!-- object -->
  <circle cx="300" cy="230" r="34" fill="#8890a0"/>
  <rect x="282" y="260" width="36" height="70" rx="10" fill="#8890a0"/>
  <text x="300" y="365" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6b7280">Objekt</text>

  <!-- key light -->
  <g>
    <rect x="110" y="110" width="26" height="60" rx="4" fill="#f5a94e"/>
    <line x1="136" y1="140" x2="280" y2="220" stroke="#f5a94e" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="60" y="90" font-family="sans-serif" font-size="16" font-weight="600" fill="#f5a94e">Hauptlicht</text>
  </g>

  <!-- fill light -->
  <g>
    <rect x="460" y="120" width="26" height="55" rx="4" fill="#7f9bff"/>
    <line x1="460" y1="145" x2="320" y2="215" stroke="#7f9bff" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="430" y="100" font-family="sans-serif" font-size="16" font-weight="600" fill="#7f9bff">Aufhelllicht</text>
  </g>

  <!-- hair / spitz light -->
  <g>
    <rect x="288" y="20" width="24" height="50" rx="4" fill="#c39bf2"/>
    <line x1="300" y1="70" x2="300" y2="196" stroke="#c39bf2" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="330" y="35" font-family="sans-serif" font-size="16" font-weight="600" fill="#c39bf2">Spitzlicht</text>
  </g>

  <!-- camera -->
  <g>
    <rect x="270" y="370" width="60" height="34" rx="6" fill="none" stroke="#6b7280" stroke-width="3"/>
    <polygon points="330,378 356,368 356,406 330,396" fill="none" stroke="#6b7280" stroke-width="3" stroke-linejoin="round"/>
    <line x1="300" y1="370" x2="300" y2="264" stroke="#6b7280" stroke-width="2" stroke-dasharray="2 5"/>
    <text x="300" y="418" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#6b7280">Kamera</text>
  </g>
</svg>
