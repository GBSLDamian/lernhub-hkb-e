<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Vergleich: Beim Vergrössern wird eine Rastergrafik grob und pixelig, eine Vektorgrafik bleibt scharf">
  <text x="160" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#6b7280">Rastergrafik</text>
  <text x="480" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#6b7280">Vektorgrafik</text>

  <!-- raster small -->
  <g transform="translate(80,50)">
    <circle cx="30" cy="30" r="26" fill="#0e8f7e"/>
    <text x="30" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">klein, scharf</text>
  </g>
  <!-- raster large: pixelated -->
  <g transform="translate(30,140)">
    <g shape-rendering="crispEdges">
      <!-- coarse pixel grid approximating a circle -->
      <rect x="60" y="0" width="20" height="20" fill="#0e8f7e"/>
      <rect x="80" y="0" width="20" height="20" fill="#0e8f7e"/>
      <rect x="40" y="20" width="20" height="20" fill="#0e8f7e"/>
      <rect x="60" y="20" width="20" height="20" fill="#0e8f7e"/>
      <rect x="80" y="20" width="20" height="20" fill="#0e8f7e"/>
      <rect x="100" y="20" width="20" height="20" fill="#0e8f7e"/>
      <rect x="20" y="40" width="20" height="20" fill="#0e8f7e"/>
      <rect x="40" y="40" width="20" height="20" fill="#0e8f7e"/>
      <rect x="60" y="40" width="20" height="20" fill="#0e8f7e"/>
      <rect x="80" y="40" width="20" height="20" fill="#0e8f7e"/>
      <rect x="100" y="40" width="20" height="20" fill="#0e8f7e"/>
      <rect x="120" y="40" width="20" height="20" fill="#0e8f7e"/>
      <rect x="20" y="60" width="20" height="20" fill="#0e8f7e"/>
      <rect x="40" y="60" width="20" height="20" fill="#0e8f7e"/>
      <rect x="60" y="60" width="20" height="20" fill="#0e8f7e"/>
      <rect x="80" y="60" width="20" height="20" fill="#0e8f7e"/>
      <rect x="100" y="60" width="20" height="20" fill="#0e8f7e"/>
      <rect x="120" y="60" width="20" height="20" fill="#0e8f7e"/>
      <rect x="40" y="80" width="20" height="20" fill="#0e8f7e"/>
      <rect x="60" y="80" width="20" height="20" fill="#0e8f7e"/>
      <rect x="80" y="80" width="20" height="20" fill="#0e8f7e"/>
      <rect x="100" y="80" width="20" height="20" fill="#0e8f7e"/>
      <rect x="60" y="100" width="20" height="20" fill="#0e8f7e"/>
      <rect x="80" y="100" width="20" height="20" fill="#0e8f7e"/>
    </g>
    <text x="80" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">vergrössert: «Treppen», unscharf</text>
  </g>

  <!-- vector small -->
  <g transform="translate(400,50)">
    <circle cx="30" cy="30" r="26" fill="#1b49d6"/>
    <text x="30" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">klein, scharf</text>
  </g>
  <!-- vector large: still smooth -->
  <g transform="translate(400,140)">
    <circle cx="80" cy="60" r="60" fill="#1b49d6"/>
    <text x="80" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b7280">vergrössert: weiterhin glatt und scharf</text>
  </g>

  <line x1="320" y1="10" x2="320" y2="300" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 6" opacity="0.5"/>
</svg>
